<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHL | Gestão de Treinamentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="app-shell">

    <!-- ============ BARRA LATERAL ============ -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-mark">DHL</span>
        <div class="sidebar__brand-text">
          <div class="sidebar__brand-title">Gestão de Treinamentos</div>
          <div class="sidebar__brand-sub">DHL Supply Chain</div>
        </div>
      </div>

      <nav class="sidebar__nav">
        <button class="nav-item" data-nav="inicio">
          <span class="nav-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>
          <span class="nav-item__label">Início</span>
        </button>

        <button class="nav-item" data-nav="treinamentos">
          <span class="nav-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5"/><path d="M4 5.5v15A2.5 2.5 0 0 0 6.5 23H20"/></svg></span>
          <span class="nav-item__label">Treinamentos</span>
        </button>
        <div class="nav-sublist">
          <button class="nav-subitem" data-nav="treinamentos/aduana">
            <span>Aduana</span>
          </button>
          <button class="nav-subitem" data-nav="treinamentos/avaria">
            <span>Avaria</span>
            <span class="nav-subitem__badge">Em breve</span>
          </button>
          <button class="nav-subitem" data-nav="treinamentos/integracao">
            <span>Integração</span>
          </button>
          <button class="nav-subitem" data-nav="treinamentos/volumosos">
            <span>Volumosos</span>
            <span class="nav-subitem__badge">Em breve</span>
          </button>
        </div>

        <button class="nav-item" data-nav="colaboradores">
          <span class="nav-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6"/><path d="M16.5 4.3a3.2 3.2 0 0 1 0 6.2"/><path d="M21.5 20c0-2.8-2.1-5.1-5-5.8"/></svg></span>
          <span class="nav-item__label">Colaboradores</span>
        </button>

        <button class="nav-item" data-nav="relatorios">
          <span class="nav-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/><path d="M2.5 20.5h19"/></svg></span>
          <span class="nav-item__label">Relatórios</span>
        </button>

        <button class="nav-item" data-nav="configuracoes">
          <span class="nav-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.5-2-3.4-2.2.6a7.7 7.7 0 0 0-1.3-.8L15.4 4h-4l-.4 2.4c-.5.2-.9.5-1.3.8l-2.2-.6-2 3.4 1.9 1.5a5.6 5.6 0 0 0 0 1.5l-1.9 1.5 2 3.4 2.2-.6c.4.3.8.6 1.3.8l.4 2.4h4l.4-2.4c.5-.2.9-.5 1.3-.8l2.2.6 2-3.4-1.9-1.5Z"/></svg></span>
          <span class="nav-item__label">Configurações</span>
        </button>
      </nav>

      <div class="sidebar__footer">
        Etapa 6 · Online e persistente<br>Versão <span id="app-version">1.0.0</span>
      </div>
    </aside>

    <!-- ============ CONTEÚDO ============ -->
    <div class="main">
      <header class="header">
        <div class="header__title-group">
          <span class="header__eyebrow" id="header-eyebrow">Visão geral</span>
          <h1 class="header__title" id="header-title">Início</h1>
        </div>
        <div class="header__actions">
          <div class="header__user">
            <span class="header__user-avatar" id="header-user-avatar">?</span>
            <span class="header__user-name" id="header-user-name">—</span>
          </div>
          <button class="btn btn--ghost" type="button" id="btn-sair" onclick="App.sair()">Sair</button>
        </div>
      </header>

      <main class="view is-active" id="view-root"></main>
    </div>

  </div>

  <!-- Camada de autenticação: login, carregamento, avisos — cobre a tela
       inteira até a pessoa estar logada e os dados carregados. -->
  <div id="auth-root"></div>

  <!-- Contêineres globais: modal (formulários) e toasts (avisos rápidos) -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- Biblioteca de terceiros: leitura de planilhas .xlsx (SheetJS) -->
  <script src="js/vendor/xlsx.full.min.js?v5"></script>

  <!-- Biblioteca de terceiros: cliente do Supabase (banco online + login) -->
  <script src="js/vendor/supabase.js?v5"></script>

  <!-- Configuração do projeto Supabase (URL + chave pública).
       Veja js/config.example.js — copie para js/config.js e preencha. -->
  <script src="js/config.js?v5"></script>

  <!-- Ícones e utilitários -->
  <script src="js/icons.js?v5"></script>
  <script src="js/utils.js?v5"></script>

  <!-- Dados fictícios (mantidos só para a ferramenta de migração) -->
  <script src="js/data/mock-data.js?v5"></script>

  <!-- Camada de acesso ao banco (um arquivo por "tabela") -->
  <script src="js/services/supabaseClient.js?v5"></script>
  <script src="js/services/authService.js?v5"></script>
  <script src="js/services/colaboradoresService.js?v5"></script>
  <script src="js/services/treinamentosService.js?v5"></script>
  <script src="js/services/aduanaService.js?v5"></script>
  <script src="js/services/importacoesService.js?v5"></script>
  <script src="js/services/integracaoService.js?v5"></script>

  <!-- Estado da aplicação (cache em memória alimentado pelo banco) -->
  <script src="js/state.js?v5"></script>

  <!-- Componentes reutilizáveis -->
  <script src="js/components/modal.js?v5"></script>
  <script src="js/components/toast.js?v5"></script>
  <script src="js/actions.js?v5"></script>

  <!-- Autenticação (login, cadastro, carregando, configuração necessária) -->
  <script src="js/modules/login.js?v5"></script>

  <!-- Análise de eficácia do treinamento (cálculo separado da tela) -->
  <script src="js/analise/calculo.js?v5"></script>
  <script src="js/analise/render-perfil.js?v5"></script>
  <script src="js/analise/render-dashboard.js?v5"></script>

  <!-- Módulos -->
  <script src="js/modules/placeholder.js?v5"></script>
  <script src="js/modules/dashboard.js?v5"></script>
  <script src="js/modules/aduana.js?v5"></script>
  <script src="js/modules/aduana-import.js?v5"></script>
  <script src="js/modules/colaboradores.js?v5"></script>
  <script src="js/modules/treinamentos.js?v5"></script>
  <script src="js/modules/integracao.js?v5"></script>
  <script src="js/modules/migracao.js?v5"></script>
  <script src="js/modules/configuracoes.js?v5"></script>

  <!-- Roteamento e inicialização -->
  <script src="js/router.js?v5"></script>
  <script src="js/app.js?v5"></script>
</body>
</html>
